<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mi reproductor de audio y video</title>
</head>
<body>
    <!--Parte de video -->
    <h1>Reproductor de video y audio</h1>
    <section id="Video">
        <h2>Video</h2>
        <video controls loop muted width="640">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        </video>
    </section>

    <!--Parte de audio-->
    <section id="Audio">
        <h2>Audio</h2>
        <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" loop controls>
        </audio>
    </section>
</body>
</html>
